<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Ninong's Food</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #2d1813;
            color: #fff4cf;
            font-family: "Playfair Display", Georgia, serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .register-page {

            position: relative;

            min-height: 100vh;

            padding:
                125px 20px 80px;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .register-background {

            position: fixed;

            inset: 0;

            z-index: 0;

            background-image:
                url("images/food-1.jpg");

            background-size: cover;

            background-position: center;

            transform: scale(1.04);

        }


        .register-background::after {

            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    90deg,
                    rgba(45,24,19,.97) 0%,
                    rgba(45,24,19,.78) 48%,
                    rgba(45,24,19,.94) 100%
                ),

                linear-gradient(
                    0deg,
                    rgba(45,24,19,.96),
                    rgba(45,24,19,.60)
                );

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .register-header {

            position: absolute;

            top: 22px;
            left: 50%;

            width:
                min(1120px, calc(100% - 50px));

            height: 80px;

            transform:
                translateX(-50%);

            z-index: 50;

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .register-logo {

            position: absolute;

            left: 0;
            top: -8px;

            width: 92px;
            height: 92px;

            display: flex;

            align-items: center;
            justify-content: center;

        }


        .register-logo-ring {

            width: 82px;
            height: 82px;

            padding: 4px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #fff4cf,
                    #d8c58d
                );

            box-shadow:

                0 0 10px
                rgba(255,244,207,.65),

                0 0 28px
                rgba(255,233,166,.20);

        }


        .register-logo-inner {

            width: 100%;
            height: 100%;

            border-radius: 50%;

            overflow: hidden;

            background: #2d1813;

        }


        .register-logo-inner img {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

        }


        /* =====================================================
           NAV BAR
        ===================================================== */

        .register-nav {

            position: absolute;

            top: 8px;
            left: 50%;

            transform:
                translateX(-50%);

            height: 52px;

            min-width: 410px;

            padding:
                0 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 42px;

            border:
                1.5px solid #fff4cf;

            border-radius: 10px;

            background:
                rgba(155,96,69,.94);

            box-shadow:

                0 10px 30px
                rgba(0,0,0,.30),

                0 0 20px
                rgba(255,244,207,.08);

        }


        .register-nav a {

            position: relative;

            color: #fff4cf;

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;

            transition:
                color .25s ease,
                transform .25s ease;

        }


        .register-nav a::after {

            content: "";

            position: absolute;

            left: 50%;
            bottom: -7px;

            width: 0;
            height: 2px;

            transform:
                translateX(-50%);

            background: #fff4cf;

            transition:
                width .25s ease;

        }


        .register-nav a:hover {

            color: #ffffff;

            transform:
                translateY(-2px);

        }


        .register-nav a:hover::after {

            width: 100%;

        }


        .register-nav a.active::after {

            width: 100%;

        }


        /* =====================================================
           SIGN IN BUTTON
        ===================================================== */

        .register-sign-in {

            position: absolute;

            top: 12px;
            right: 0;

            width: 112px;
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1.5px solid #fff4cf;

            border-radius: 8px;

            background:
                rgba(45,24,19,.72);

            color: #fff4cf;

            text-decoration: none;

            font-size: 14px;

            font-style: italic;

            font-weight: 700;

            transition:
                .25s ease;

        }


        .register-sign-in.active {

            background: #9b6045;

            box-shadow:
                0 0 16px
                rgba(255,244,207,.25);

        }


        .register-sign-in:hover {

            background: #9b6045;

            transform:
                translateY(-2px);

            box-shadow:
                0 0 16px
                rgba(255,244,207,.25);

        }


        /* =====================================================
           ACCOUNT CARD
        ===================================================== */

        .account-card {

            position: relative;

            z-index: 10;

            width:
                min(760px, 94vw);

            padding:
                45px 50px 40px;

            border:
                2px solid #fff4cf;

            border-radius: 28px;

            background:

                linear-gradient(
                    145deg,
                    rgba(73,40,30,.97),
                    rgba(45,24,19,.96)
                );

            box-shadow:

                0 30px 90px
                rgba(0,0,0,.58),

                0 0 35px
                rgba(255,233,166,.14),

                inset 0 1px 0
                rgba(255,244,207,.08);

            backdrop-filter:
                blur(18px);

        }
    </style>
</head>
<body class="register-page">

    <div class="register-background"></div>

    <header class="register-header">
        <div class="register-logo">
            <span class="register-logo-ring">
                <span class="register-logo-inner">
                    <img src="images/NF New Logo.png" alt="Ninong's Food logo">
                </span>
            </span>
        </div>
        <div class="register-nav">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="features.html">Features</a>
        </div>
        <a href="register.html" class="register-sign-in active">Sign In</a>
    </header>
